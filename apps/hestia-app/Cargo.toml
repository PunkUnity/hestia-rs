[package]
name = "hestia-app"
description = "Hestia RS graphical client: the Slint shell over hestia-frontend, for Linux and Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
# rlib for the desktop binary, cdylib for the Android NativeActivity.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hestia-app"
path = "src/main.rs"

[features]
default = ["openh264", "vaapi"]
# Software H.264 decoding (the fallback; Android decodes with MediaCodec).
openh264 = ["hestia-frontend/openh264", "hestia-media/openh264"]
# Hardware decoding through VA-API on Linux (nothing on Android).
vaapi = ["hestia-frontend/vaapi", "hestia-media/vaapi"]

[dependencies]
# Everything but the UI toolkit: the controller, input, system services and
# video presentation. This crate only draws it with Slint.
hestia-frontend.workspace = true
hestia-core.workspace = true
hestia-media.workspace = true
slint.workspace = true
log.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger.workspace = true
directories.workspace = true
# winit underneath Slint: keys by position, touch screens' fingers, relative
# mouse motion and pointer lock (src/desktop_input.rs).
slint = { workspace = true, features = ["unstable-winit-030"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }
android_logger.workspace = true
jni = "0.21"
# The (patched) backend Slint uses, for its input hook (game controllers)
# and the TV remote's focus navigation.
i-slint-backend-android-activity = "=1.19.0"

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"
i-slint-core = "=1.19.0"
# examples/screenshots.rs renders headless with the software renderer and
# saves PNGs.
slint = { workspace = true, features = ["renderer-software"] }
image.workspace = true

[build-dependencies]
slint-build.workspace = true

# Used by `cargo apk build -p hestia-app --lib` for quick local arm64
# builds. scripts/android-package.sh builds APKs with the PiP activity,
# Android TV launcher and banner from android/AndroidManifest.xml.
[package.metadata.android]
package = "com.mroz59.hestia.rs"
apk_name = "hestia-rs"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

# Wi-Fi locks that keep the radio out of power save during a stream.
[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

# Whether Bluetooth is on, for the session report.
[[package.metadata.android.uses_permission]]
name = "android.permission.BLUETOOTH"
max_sdk_version = 30

# Controller rumble on the phone when the controller has no motor.
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[package.metadata.android.application]
label = "Hestia RS"

# Rotation, keyboards and display changes must not recreate the activity
# (that would restart the native app mid-stream).
[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density"
