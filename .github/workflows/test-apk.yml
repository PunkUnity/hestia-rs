# PunkUnity fork only: builds "Hestia RS (test)" from a test/* branch and
# puts it on the rolling "test-latest" release, so the phone always downloads
# https://github.com/PunkUnity/hestia-rs/releases/download/test-latest/hestia-rs-test-arm64.apk
name: Test APK

on:
  push:
    branches: ["test/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  apk:
    if: github.repository == 'PunkUnity/hestia-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;30.0.16248370"

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-apk-arm64

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - name: Build the test APK
        run: tools/test-apk/build.sh apks

      - name: Publish to the test-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info=$(cat apks/hestia-rs-test-arm64.txt)
          notes="$info"$'\n\n'"Built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
          if gh release view test-latest >/dev/null 2>&1; then
            gh release upload test-latest apks/hestia-rs-test-arm64.apk apks/hestia-rs-test-arm64.txt --clobber
            gh release edit test-latest --title "Hestia RS (test): ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" --notes "$notes" --prerelease
          else
            gh release create test-latest apks/hestia-rs-test-arm64.apk apks/hestia-rs-test-arm64.txt \
              --title "Hestia RS (test): ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
